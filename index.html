<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel = "stylesheet" href = "styles.css">
    <script src = "books.js" defer></script>
    <title>My Library</title>
</head>
<body>
    <header>
        <h1>My Library</h1>
        <button type="button" id="open-form-button">+ Add Book</button>
    </header>
    <main class = "book-collection">
        
    </main>

    <dialog id="book-dialog">
        <form id="book-form">
            <h2>Add a new Book to the library</h2>
            <div class="form-group">
                <label for="title">Title:</label>
                <input type="text" id="title" name="title" required>

            <div class="form-group">
                <label for="author">Author:</label>
                <input type="text" id="author" name="author" required>
            </div>

            <div class="dialog-buttons">
                <button type="submit" id="add-book">Add Book</button>
                <button type="button" id="cancel-form">Cancel</button>
            </div>
        </form>
    </dialog>
    

</body>
</html>
